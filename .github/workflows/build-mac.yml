name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm install
    - run: npm run build
    - run: npm run dist:mac
    - run: ls -la dist-electron/ || echo "NO DIR"
    - name: Create release
      run: gh release create v1.2.0 --title "v1.2.0" --notes "跨平台安装包" || true
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Upload macOS DMG
      run: gh release upload v1.2.0 dist-electron/*.dmg --clobber
      env:
        GH_TOKEN: ${{ github.token }}
