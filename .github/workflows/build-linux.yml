name: Build Linux App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm install
    - run: npm run build
    - run: npm run dist:linux
    - run: ls -la dist-electron/ || echo "NO dist-electron"
    - run: gh release create v1.2.0 --title "v1.2.0" --notes "Windows / macOS / Linux" || true
      env: { GH_TOKEN: ${{ github.token }} }
    - run: gh release upload v1.2.0 dist-electron/*.AppImage dist-electron/*.deb --clobber
      env: { GH_TOKEN: ${{ github.token }} }
