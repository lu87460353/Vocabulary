name: Build Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm install
    - run: npm run build
    - run: npm run dist:win
    - run: gh release create v1.2.0 --title "v1.2.0 - 跨平台词汇背诵助手" --notes "Windows / macOS / Linux 安装包" || true
      env:
        GH_TOKEN: ${{ github.token }}
    - run: gh release upload v1.2.0 dist-electron/*.exe --clobber
      env:
        GH_TOKEN: ${{ github.token }}
